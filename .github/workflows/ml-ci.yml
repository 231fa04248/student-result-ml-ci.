
name: Student Result ML CI CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-test-containerize:
    name: Train, Test and Docker Validation
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3: Upgrade pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # Step 4: Install dependencies
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Step 5: Train ML model
      - name: Train student result model
        run: python train_model.py

      # Step 6: Check ML quality gate
      - name: Check ML quality gate
        run: python quality_gate.py

      # Step 7: Run automated tests
      - name: Run automated tests
        run: python -m unittest discover -v

      # Step 8: Build Docker image
      - name: Build Docker image
        run: docker build -t student-result-ml:${{ github.sha }} .

      # Step 9: Start Docker container
      - name: Start Docker container
        run: |
          docker run -d \
            --name student-result-ml-container \
            -p 5000:5000 \
            student-result-ml:${{ github.sha }}

      # Step 10: Wait for application to become ready
      - name: Wait for application to become ready
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5001/health; then
              echo "Application is ready."
              exit 0
            fi

            echo "Waiting for application... attempt $i"
            sleep 2
          done

          echo "Application did not become ready."
          docker logs student-result-ml-container
          exit 1

      # Step 11: Test prediction endpoint
      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"attendance":90,"internal_marks":85,"assignment_marks":88,"previous_score":80}' \
            http://localhost:5000/predict)

          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction"'

      # Step 12: Show Docker container logs
      - name: Show Docker container logs
        if: always()
        run: docker logs student-result-ml-container || true

      # Step 13: Stop and remove Docker container
      - name: Stop and remove Docker container
        if: always()
        run: docker rm -f student-result-ml-container || true

      # Step 14: Prepare release candidate
      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate

          cp app.py release_candidate/
          cp student_result_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          cp Dockerfile release_candidate/
          cp .dockerignore release_candidate/

          echo "Student Result Prediction ML Application" > release_candidate/DEPLOYMENT.txt
          echo "Run: python app.py" >> release_candidate/DEPLOYMENT.txt
          echo "Endpoint: POST /predict" >> release_candidate/DEPLOYMENT.txt

          ls -la release_candidate/

      # Step 15: Upload release candidate
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: student-result-ml-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7
